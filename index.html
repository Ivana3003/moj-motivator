<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gde se laboratorijska preciznost susreće sa kodom. Moj Motivator je autorski projekat Ivane Tatić koji primenjuje analitičke principe na ličnu produktivnost i motivaciju korisnika."
    />
    <title>Moj Motivator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/clover.png" />
  </head>
  <body>
    <div class="app-container">
      <button
        id="theme-toggle"
        class="icon-only-btn"
        aria-label="Toggle dark mode"
      >
      </button>
      <h1>🌟 Moj Motivator</h1>
      <div id="display-area">
        <p id="poruka">Klikni na dugme za dozu inspiracije!</p>
      </div>

      <section class="daily-focus" aria-labelledby="daily-focus-title">
        <h2 id="daily-focus-title">Dnevni fokus</h2>
        <form id="daily-focus-form">
          <label for="daily-focus-input" class="sr-only">Tvoj fokus za danas</label>
          <input
            type="text"
            id="daily-focus-input"
            maxlength="120"
            placeholder="Šta želiš da postigneš danas?"
          />
          <button type="submit" id="daily-focus-save">Sačuvaj fokus</button>
        </form>
        <div id="daily-focus-status" class="daily-focus-status" hidden>
          <span id="daily-focus-text"></span>
          <label class="focus-complete">
            <input type="checkbox" id="daily-focus-complete" />
            Završeno
          </label>
        </div>
      </section>

      <div class="input-group">
        <label for="nova-poruka" class="sr-only">Tvoja poruka:</label>
        <input
          type="text"
          id="nova-poruka"
          placeholder="Napiši šta te motiviše..."
          maxlength="150"
        />
        <button id="add-btn">Dodaj</button>
      </div>

      <button id="generate-btn">Nova Poruka 🚀</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/main.js"></script>
  </body>
</html>
