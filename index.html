<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browser-based personal productivity tool for daily focus, custom motivational messages, favorites, and short self-reflection."
    />
    <link rel="canonical" href="https://it-moj-motivator.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moj Motivator" />
    <meta property="og:title" content="Moj Motivator" />
    <meta
      property="og:description"
      content="A browser-based personal productivity tool for daily focus, custom motivational messages, favorites, and short self-reflection."
    />
    <meta property="og:url" content="https://it-moj-motivator.netlify.app/" />
    <meta
      property="og:image"
      content="https://it-moj-motivator.netlify.app/light-screenshot.png"
    />
    <meta property="og:image:width" content="1101" />
    <meta property="og:image:height" content="1184" />
    <meta
      property="og:image:alt"
      content="Moj Motivator application interface"
    />
    <title>Moj Motivator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/clover.png" />
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="js/message-logic.js"></script>
    <script defer src="js/i18n.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <div class="app-container">
      <button
        id="theme-toggle"
        class="icon-only-btn"
        aria-label="Toggle dark mode"
        data-i18n-aria-label="themeToggle"
        aria-pressed="false"
        type="button"
      ></button>
      <div class="language-switcher" aria-label="Language selector">
        <button id="language-sr" class="active" type="button">SR</button>
        <span aria-hidden="true">|</span>
        <button id="language-en" type="button">EN</button>
      </div>
      <h1 data-i18n="appTitle">🌟 Moj Motivator</h1>
      <div id="display-area" aria-live="polite" aria-atomic="true">
        <p id="poruka" data-i18n="introMessage">
          Klikni na dugme za dozu inspiracije!
        </p>
      </div>

      <section class="daily-focus" aria-labelledby="daily-focus-title">
        <h2 id="daily-focus-title" data-i18n="dailyFocus">Dnevni fokus</h2>
        <form id="daily-focus-form">
          <label
            for="daily-focus-input"
            class="sr-only"
            data-i18n="dailyFocusLabel"
            >Tvoj fokus za danas</label
          >
          <input
            type="text"
            id="daily-focus-input"
            maxlength="120"
            placeholder="Šta želiš da postigneš danas?"
            data-i18n-placeholder="dailyFocusPlaceholder"
          />
          <button type="submit" id="daily-focus-save" data-i18n="saveFocus">
            Sačuvaj fokus
          </button>
        </form>
        <div id="daily-focus-status" class="daily-focus-status" hidden>
          <span id="daily-focus-text"></span>
          <div class="daily-focus-actions">
            <label class="focus-complete">
              <input type="checkbox" id="daily-focus-complete" />
              <span data-i18n="completed">Završeno</span>
            </label>
            <button type="button" id="daily-focus-delete" data-i18n="delete">
              Obriši
            </button>
          </div>
        </div>
      </section>

      <div class="input-group">
        <label for="nova-poruka" class="sr-only" data-i18n="messageLabel"
          >Tvoja poruka:</label
        >
        <input
          type="text"
          id="nova-poruka"
          placeholder="Napiši šta te motiviše..."
          data-i18n-placeholder="messagePlaceholder"
          maxlength="150"
        />
        <button id="add-btn" type="button" data-i18n="add">Dodaj</button>
      </div>

      <section class="user-messages" aria-labelledby="user-messages-title">
        <div class="user-messages-header">
          <h2 id="user-messages-title" data-i18n="myMessages">Moje poruke</h2>
          <label class="favorites-filter">
            <input type="checkbox" id="favorites-only" />
            <span data-i18n="favoritesOnly">Samo omiljene</span>
          </label>
        </div>
        <p id="user-messages-empty" class="user-messages-empty">
          <span data-i18n="emptyMessages">Još nemaš sačuvanih poruka.</span>
        </p>
        <ul id="user-messages-list" class="user-messages-list"></ul>
      </section>

      <button id="generate-btn" type="button" data-i18n="newMessage">
        Nova Poruka 🚀
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
